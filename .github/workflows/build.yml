
name: Compiler Faction Dominion

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compiler le plugin
        run: mvn -B clean package

      - name: Publier le JAR
        uses: actions/upload-artifact@v4
        with:
          name: FactionDominion-JAR
          path: target/*.jar
